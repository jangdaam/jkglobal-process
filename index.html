<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>제이케이글로벌 가공 기록실</title>
  <link rel="preload" href="assets/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="main.css?v=2">
</head>
<body>
  <header><div class="bar">
    <img src="assets/jk-logo.png" alt="제이케이글로벌">
    <span>생산품질부</span>
    <button id="data" class="outline">자료 관리</button>
  </div></header>
  <main>
    <section class="headline">
      <div class="hero-copy">
        <h1>가공 기록실</h1>
        <p>원료를 투입한 순간부터 유온이 회복될 때까지,<br>두 생산 회차의 기록을 비교합니다.</p>
      </div>
      <figure><img src="assets/equipment.jpg" alt="제이케이글로벌 후라이어">
        <figcaption><a href="https://jk-global.kr/business/production/" target="_blank" rel="noopener">제조 설비 보기</a></figcaption>
      </figure>
    </section>
    <div class="selectors">
      <label>제품<select id="product"></select></label>
      <label>생산 회차<select id="batch"></select></label>
      <label>비교 회차<select id="compare"></select></label>
    </div>
    <nav aria-label="업무 선택">
      <button data-tab="raw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>원료 검수</button>
      <button data-tab="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16h18M5 11h3l3-5 4 11 3-6h3"/></svg>튀김 기록 재생</button>
      <button data-tab="note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l3 3v15H6zM9 10h7M9 14h7"/></svg>점검 일지</button>
    </nav>
    <section id="work"></section>
  </main>
  <footer>훈련용 생산 기록 <span>제이케이글로벌 가공 기록실</span></footer>
  <dialog id="modal"><div id="body"></div><form method="dialog"><button class="outline">닫기</button></form></dialog>
  <div id="toast" role="status"></div>
  <script src="model.js?v=3"></script><script src="app.js?v=3"></script>
</body>
</html>
